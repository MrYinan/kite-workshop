<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>绘本详情 · 鸢时漫记 | 纸鸢非遗</title>
  <!-- 思源宋体（与首页统一） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome 图标库（用于返回按钮图标） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ========== 全局样式重置 ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Noto Serif SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', serif;
      background-color: #F5F0E8; /* kite-beige */
      color: #4a3b2c;
      line-height: 1.5;
    }

    /* ========== 页面容器 ========== */
    .book-detail-container {
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 2rem 1.5rem;
    }

    /* ========== 全屏背景图（柔化处理） ========== */
    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      object-fit: cover;
      opacity: 0.4;          /* 降低透明度，让前景更突出 */
      filter: blur(0px);     /* 增加模糊，营造景深感 */
    }

    /* ========== 页面内容层 ========== */
    .page-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ========== 返回按钮（新增强化） ========== */
    .back-btn {
      position: fixed;        /* 固定位置，始终可见 */
      top: 1.5rem;
      left: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      border-radius: 2rem;
      border: 1px solid #8C6A48;
      color: #4A7B60;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(140, 106, 72, 0.15);
      transition: all 0.3s ease;
      z-index: 100;
    }
    .back-btn:hover {
      background: #8C6A48;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(74, 123, 96, 0.25);
    }
    .back-btn i {
      font-size: 1.2rem;
    }

    /* ========== 绘本标题（卡片化） ========== */
    .book-title {
      font-size: 2rem;
      font-weight: 600;
      color: #4A7B60;            /* kite-green */
      margin: 1rem 0 2.5rem 0;
      padding: 0.8rem 2rem;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      border-radius: 3rem;
      box-shadow: 0 4px 16px rgba(140, 106, 72, 0.1);
      border: 1px solid #E8DCC8;
      letter-spacing: 1px;
      text-align: center;
    }

    /* ========== 绘本图片列表（两列布局） ========== */
    .book-images {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1.8rem;
      width: 100%;
    }

    /* 单个图片项（卡片美化） */
    .image-item {
      width: calc(50% - 0.9rem);   /* 精确两列间距 */
      margin-bottom: 1.8rem;
      background: white;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(140, 106, 72, 0.08);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      border: 1px solid rgba(232, 220, 200, 0.6);
    }

    .image-item:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 32px rgba(74, 123, 96, 0.15);
      border-color: #4A7B60;
    }

    /* 绘本图片样式 */
    .book-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      cursor: pointer;
      transition: transform 0.5s ease;
      background-color: #faf7f2;   /* 柔和底色 */
      padding: 1rem;                /* 图片留白，更透气 */
    }

    .book-img:hover {
      transform: scale(1.02);
    }

    /* 图片加载占位动画 */
    .book-img.loading {
      background: linear-gradient(90deg, #faf7f2 25%, #f5f0e6 50%, #faf7f2 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      min-height: 250px;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ========== 图片预览弹窗（优化） ========== */
    .preview-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .preview-modal.show {
      opacity: 1;
      visibility: visible;
    }

    .preview-img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 1rem;
      box-shadow: 0 0 40px rgba(255, 215, 175, 0.3);
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }

    .preview-modal.show .preview-img {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 2rem;
      right: 2rem;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: rotate(90deg) scale(1.1);
    }

    /* ========== 响应式适配 ========== */
    @media (max-width: 768px) {
      .book-detail-container {
        padding: 1.5rem 1rem;
      }

      .back-btn {
        top: 1rem;
        left: 1rem;
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
      }

      .book-title {
        font-size: 1.6rem;
        padding: 0.6rem 1.5rem;
        margin: 0.5rem 0 2rem;
      }

      .image-item {
        width: 100%;                /* 手机端单列 */
        margin-bottom: 1.5rem;
      }

      .book-images {
        gap: 1.5rem;
      }

      .close-btn {
        top: 1.5rem;
        right: 1.5rem;
        width: 3rem;
        height: 3rem;
        font-size: 1.6rem;
      }
    }

    @media (max-width: 480px) {
      .book-title {
        font-size: 1.3rem;
        padding: 0.5rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="book-detail-container">
    <!-- 全屏背景图 -->
    <img 
      src="../static/images/index/背景图1.jpg"  
      class="bg-image"
      alt="背景图"
      loading="lazy" 
    >

    <!-- 返回按钮（新增，点击返回上一页） -->
    <div class="back-btn" onclick="goBack()">
      <i class="fa-solid fa-arrow-left"></i>
      <span>返回</span>
    </div>

    <div class="page-content">
      <!-- 绘本标题（动态显示） -->
      <span class="book-title" id="bookTitle"></span>

      <!-- 绘本图片列表 -->
      <div class="book-images" id="bookImages"></div>
    </div>
  </div>

  <!-- 图片预览弹窗 -->
  <div class="preview-modal" id="previewModal">
    <button class="close-btn" onclick="closePreview()">×</button>
    <img src="" class="preview-img" id="previewImg">
  </div>

  <script>
    // 存储当前绘本图片列表（用于预览等功能）
    let currentBookImages = [];

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const title = decodeURIComponent(urlParams.get('title') || '');
      document.getElementById('bookTitle').textContent = title;
      getBookImages(title);
    };

    // 绘本图片数据（与原代码一致）
    function getBookImages(title) {
      const bookData = {
        "《风筝的传承》": {
          images: [
            "../static/images/oral-history/1.《风筝的传承》/《风筝的传承》1.jpg",
            "../static/images/oral-history/1.《风筝的传承》/《风筝的传承》2.jpg",
            "../static/images/oral-history/1.《风筝的传承》/《风筝的传承》3.jpg",
            "../static/images/oral-history/1.《风筝的传承》/《风筝的传承》4.jpg",
            "../static/images/oral-history/1.《风筝的传承》/《风筝的传承》5.jpg",
            "../static/images/oral-history/1.《风筝的传承》/《风筝的传承》6.jpg",
          ]
        },
        "《风筝的千年之旅》": {
          images: [
            "../static/images/oral-history/2.《风筝的千年之旅》/《风筝的千年之旅》1.jpg",
            "../static/images/oral-history/2.《风筝的千年之旅》/《风筝的千年之旅》2.jpg",
            "../static/images/oral-history/2.《风筝的千年之旅》/《风筝的千年之旅》3.jpg",
            "../static/images/oral-history/2.《风筝的千年之旅》/《风筝的千年之旅》4.jpg",
            "../static/images/oral-history/2.《风筝的千年之旅》/《风筝的千年之旅》5.jpg",
            "../static/images/oral-history/2.《风筝的千年之旅》/《风筝的千年之旅》6.jpg",
          ]
        },
        "《风筝与世界的对话》": {
          images: [
            "../static/images/oral-history/3.《风筝与世界的对话》/《风筝与世界的对话》1.jpg",
            "../static/images/oral-history/3.《风筝与世界的对话》/《风筝与世界的对话》2.jpg",
            "../static/images/oral-history/3.《风筝与世界的对话》/《风筝与世界的对话》3.jpg",
            "../static/images/oral-history/3.《风筝与世界的对话》/《风筝与世界的对话》4.jpg",
            "../static/images/oral-history/3.《风筝与世界的对话》/《风筝与世界的对话》5.jpg",
            "../static/images/oral-history/3.《风筝与世界的对话》/《风筝与世界的对话》6.jpg",
          ]
        }
      };

      const imagesContainer = document.getElementById('bookImages');
      if (bookData[title]) {
        currentBookImages = bookData[title].images;
        let html = '';
        currentBookImages.forEach(imgSrc => {
          html += `
            <div class="image-item">
              <img 
                src="${imgSrc}" 
                class="book-img loading" 
                alt="绘本图片"
                loading="lazy" 
                onload="this.classList.remove('loading')"
                onclick="previewImage('${imgSrc}')"
              >
            </div>
          `;
        });
        imagesContainer.innerHTML = html;
      } else {
        // 兜底图片
        currentBookImages = ["/static/images/oral-history/默认封面.png"];
        imagesContainer.innerHTML = `
          <div class="image-item">
            <img 
              src="/static/images/oral-history/默认封面.png" 
              class="book-img" 
              alt="默认封面"
              loading="lazy"
              onclick="previewImage('/static/images/oral-history/默认封面.png')"
            >
          </div>
        `;
      }
    }

    // 预览图片
    function previewImage(imgSrc) {
      const previewModal = document.getElementById('previewModal');
      const previewImg = document.getElementById('previewImg');
      
      previewImg.src = '';
      previewModal.classList.remove('show');
      
      previewImg.src = imgSrc;
      previewImg.onload = function() {
        previewModal.classList.add('show');
      };
      // 如果希望加载失败提示，可以取消下面注释
      // previewImg.onerror = function() {
      //   alert('图片加载失败');
      // };
    }

    // 关闭预览
    function closePreview() {
      document.getElementById('previewModal').classList.remove('show');
      setTimeout(() => {
        document.getElementById('previewImg').src = '';
      }, 300);
    }

    // 点击弹窗背景关闭
    document.getElementById('previewModal').addEventListener('click', function(e) {
      if (e.target === this) closePreview();
    });

    // 按 ESC 关闭
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closePreview();
    });

    // 返回上一页
    function goBack() {
      window.history.back();
    }
  </script>
</body>
</html>
